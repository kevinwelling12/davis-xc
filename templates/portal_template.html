<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Davis XC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
<style>
/* Davis High Athletics design system (tokens.json): Montserrat; devil-blue #2D3289 header band, devil-navy #142E54 tabs and
   footer band; brand-ink for brand text; links in action blue. Radius 4 px for controls, 8 px for cards. */
:root{
 --devil-blue:#2D3289;--devil-navy:#142E54;--action-blue:#0074B2;
 --bg:#FFFFFF;--panel:#F4F5FA;--ink:#181818;--muted:#5C5F6B;--faint:#767676;--line:#D6D9E6;--rule:#767676;
 --accent:#006399;--on-accent:#FFFFFF;--brand:#2D3289;--brand-ink:#2D3289;--heading:#185594;
 --chip-on:#2D3289;--chip-on-ink:#FFFFFF;--deep:#2D3289;--navy:#142E54;--band-ink:#FFFFFF;--band-muted:#D5D8F0;
 --ours:rgba(45,50,137,.08);--ours-edge:#2D3289;--good:#1E6B36;--bad:#860000;--bar:#5C5F6B;--bar-ours:#2D3289;
 --sans:Montserrat,"Helvetica Neue",Helvetica,Arial,sans-serif;--pad:16px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0A0F1C;--panel:#18213A;--ink:#F2F4F8;--muted:#A7B0C2;--faint:#8A93A8;--line:#2A3550;--rule:#8A93A8;
 --accent:#6CC0F0;--on-accent:#0A0F1C;--brand:#A9AFFF;--brand-ink:#A9AFFF;--heading:#8CBCEB;
 --chip-on:#A9AFFF;--chip-on-ink:#0A0F1C;--deep:#2D3289;--navy:#142E54;
 --ours:rgba(169,175,255,.10);--ours-edge:#A9AFFF;--good:#6FD08C;--bad:#FF9A92;--bar:#8A93A8;--bar-ours:#A9AFFF;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0A0F1C;--panel:#18213A;--ink:#F2F4F8;--muted:#A7B0C2;--faint:#8A93A8;--line:#2A3550;--rule:#8A93A8;
 --accent:#6CC0F0;--on-accent:#0A0F1C;--brand:#A9AFFF;--brand-ink:#A9AFFF;--heading:#8CBCEB;
 --chip-on:#A9AFFF;--chip-on-ink:#0A0F1C;--deep:#2D3289;--navy:#142E54;
 --ours:rgba(169,175,255,.10);--ours-edge:#A9AFFF;--good:#6FD08C;--bad:#FF9A92;--bar:#8A93A8;--bar-ours:#A9AFFF;color-scheme:dark}
@media (min-width:720px){:root{--pad:24px}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* header band: devil blue, the seal on a white disc, white wordmark */
.band{background:var(--deep);color:#fff;padding-top:env(safe-area-inset-top,0)}
.top{max-width:1040px;margin:0 auto;padding:16px var(--pad) 14px;display:flex;align-items:center;gap:14px}
.seal{flex:none;width:60px;height:60px;border-radius:50%;background:#fff;padding:6px;display:block}
.top h1{margin:0;font:800 clamp(20px,5vw,28px)/1.1 var(--sans);color:var(--band-ink)}
.top p{margin:3px 0 0;color:var(--band-muted);font:700 12px/1.3 var(--sans);letter-spacing:1px;text-transform:uppercase}
.tabs{position:sticky;top:0;z-index:5;background:var(--navy)}
.tabs-in{max-width:1040px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 calc(var(--pad) - 12px)}
.tabs-in::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:#C9CFE0;padding:0 12px;min-height:48px;font:700 12px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.tabs button:focus-visible{outline-color:#fff;outline-offset:-3px}
@media (max-width:430px){.tabs button{padding:0 9px;letter-spacing:.5px}}

.wrap{max-width:1040px;margin:0 auto;padding:22px var(--pad) 64px}
section{display:none}section.on{display:block}
h2{font:700 28px/34px var(--sans);color:var(--brand-ink);margin:0 0 6px}
h3{font:700 18px/24px var(--sans);color:var(--heading);margin:32px 0 8px}
.sub{color:var(--muted);font-size:14px;margin:6px 0 14px;max-width:72ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
.bar.g{margin:4px 0 4px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--bg);padding:0 14px;border-radius:4px;font:700 12px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
select,input[type=search]{min-height:40px;border:1px solid var(--faint);border-radius:4px;background:var(--bg);padding:0 10px;max-width:100%}
input[type=search]{width:min(260px,100%)}
.tw{overflow-x:auto;margin:0 0 8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:700 11px/1.2 var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.ours td{background:var(--ours)}
tr.ours td:first-child{box-shadow:inset 3px 0 0 var(--ours-edge)}
td .s{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:700;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.good{color:var(--good)}.bad{color:var(--bad)}
.badge{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;padding:3px 5px;border-radius:4px;background:var(--panel);color:var(--ink);border:1px solid var(--line);margin-left:6px;vertical-align:1px}
.badge.pb{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0 8px}
.card{background:var(--panel);border-radius:8px;padding:14px 16px}
.card .k{font:700 11px/1.2 var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.card .v{font:800 26px/1.15 var(--sans);color:var(--brand-ink);margin-top:6px}
.card .s{color:var(--muted);font-size:13px}
.note{background:var(--panel);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--ink);margin:12px 0;max-width:80ch}
.dist{display:flex;height:14px;min-width:90px;border-radius:4px;overflow:hidden;background:var(--line)}
.dist span{display:block;height:100%}
svg text{fill:var(--muted);font:500 11px var(--sans)}
.chart{width:100%;height:auto;display:block;margin:6px 0 4px}
.foot{background:var(--navy);color:#C9CFE0;font-size:13px}
.foot a{color:#fff}
.foot-in{max-width:1040px;margin:0 auto;padding:18px var(--pad) calc(24px + env(safe-area-inset-bottom,0))}
.empty{color:var(--muted);padding:20px 0}
@media (max-width:640px){.hide-s{display:none}}
</style>
</head>

<script id="portal-data">window.D = __DATA__;</script>
<script id="portal-app">
(function(){
const D = window.D;
if (!D || !D.meta) return;
const OUR = D.meta.team || 'Davis';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (s == null) return ''; const m = Math.floor(s / 60), x = s - 60 * m; return m + ':' + (x < 10 ? '0' : '') + x.toFixed(1); };
const fmt0 = s => { if (s == null) return ''; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const pace = (s, mi) => mi ? fmt0(s / mi) + '/mi' : '';
const pct = v => v == null ? '' : Math.round(100 * v) + '%';
const ord = n => n + (['st','nd','rd'][((n + 90) % 100 - 10) % 10 - 1] || 'th');
const date = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
const sdate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
const distLabel = mi => Math.abs(mi - 3.107) < .02 ? '5K' : Math.abs(mi - 1.988) < .02 ? '3200 m' : Math.abs(mi - 2) < .03 ? '2 mi' : Math.abs(mi - 3) < .03 ? '3 mi' : mi.toFixed(2) + ' mi';
const seasonOf = d => { const y = +d.slice(0, 4), m = +d.slice(5, 7); return m >= 7 ? y : y - 1; };
const gradeLabel = g => g ? ({9: 'Fr', 10: 'So', 11: 'Jr', 12: 'Sr'}[g] || g) : '';
const clsLabel = c => c ? '’' + String(c).slice(2) : '';
const GN = {M: 'Boys', F: 'Girls'}, gn = g => GN[g] || '';
const R = D.runners, byId = Object.fromEntries(R.map(r => [r.id, r]));
const races = D.races, raceById = Object.fromEntries(races.map(r => [r.id, r]));
const S = {tab: 'roster', g: 'M', rosterAll: false, q: '', runner: null, meetSeason: D.meta.season, meet: null, meetView: 'report', champ: 'section', sim: 0};
try { Object.assign(S, JSON.parse(localStorage.getItem('dx-ui') || '{}')); } catch (e) {}
if (!GN[S.g]) S.g = 'M';
const save = () => { try { localStorage.setItem('dx-ui', JSON.stringify({tab: S.tab, g: S.g, runner: S.runner, meetView: S.meetView, champ: S.champ})); } catch (e) {} };
const firstOf = g => (R.find(r => r.g === g && r.current) || R.find(r => r.g === g) || {}).id;
if (!byId[S.runner]) S.runner = firstOf(S.g);

/* result vs expected, in seconds, against the likely (80%) range */
function vsExp(sec, exp) {
  if (!exp) return '';
  const [raw, e, lo, hi] = exp, d = Math.round(sec - e);
  const head = Math.abs(d) <= 2 ? 'right on it' : Math.abs(d) + ' s ' + (d < 0 ? 'faster' : 'slower');
  let tail, cls = '';
  if (sec < lo) { tail = 'ahead of range by ' + Math.round(lo - sec) + ' s'; cls = 'good'; }
  else if (sec > hi) { tail = 'past range by ' + Math.round(sec - hi) + ' s'; cls = 'bad'; }
  else tail = 'inside range';
  return `<span class="${cls}">${head}</span><span class="s">${tail}</span>`;
}

/* ---------- tabs ---------- */
const TABS = [['roster', 'Roster'], ['runner', 'Runner'], ['meets', 'Meets'], ['proj', 'Projections'], ['sim', 'Simulation'], ['model', 'Model']]
  .filter(([k]) => k !== 'sim' || (D.sims && D.sims.length));
const VIEWS = {roster: roster, runner: runner, meets: meets, proj: proj, sim: sim, model: model};
$('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="false">${l}</button>`).join('');
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
function go(t, scroll = true) {
  if (!TABS.some(([k]) => k === t)) t = 'roster';
  S.tab = t; save();
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === 't-' + t));
  VIEWS[t]();
  if (scroll) window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const gb = e.target.closest('[data-g]');
  if (gb) { S.g = gb.dataset.g; const r = byId[S.runner]; if (!r || r.g !== S.g) S.runner = firstOf(S.g); save(); VIEWS[S.tab](); return; }
  const a = e.target.closest('[data-runner]');
  if (a) { S.runner = a.dataset.runner; if (byId[S.runner]) S.g = byId[S.runner].g; go('runner'); return; }
  const m = e.target.closest('[data-meet]');
  if (m) { S.meet = m.dataset.meet; S.meetSeason = seasonOf(m.dataset.meet.split('|')[1]); if (raceById[S.meet]) S.g = raceById[S.meet].g; go('meets'); }
});
const nameBtn = r => r ? `<button class="lnk" data-runner="${esc(r.id)}">${esc(r.name)}</button>` : '';
const chips = (items, cur, attr) => items.map(([v, l]) => `<button class="chip" ${attr}="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`).join('');
const gchips = () => `<div class="bar g" role="group" aria-label="Boys or girls">${chips([['M', 'Boys'], ['F', 'Girls']], S.g, 'data-g')}</div>`;

/* ---------- roster ---------- */
function roster() {
  const el = $('#t-roster'), sea = D.meta.season;
  const list = R.filter(r => r.g === S.g && (S.rosterAll || r.current) && (!S.q || r.name.toLowerCase().includes(S.q.toLowerCase())));
  const best = r => { const xs = r.races.filter(x => seasonOf(x.date) === sea && x.eq_day); return xs.length ? Math.min(...xs.map(x => x.eq_day)) : null; };
  const rows = list.map((r, i) => {
    const last = r.races[r.races.length - 1], n = r.races.filter(x => seasonOf(x.date) === sea).length;
    return `<tr><td class="r num">${r.current ? i + 1 : ''}</td><td>${nameBtn(r)}<span class="s">${r.current ? gradeLabel(r.grade) + ' · ' : 'Class of ' + (r.cls || '') + ' · '}${esc(last.level)}</span></td>
      <td class="r num">${fmt(r.rating)}</td><td class="r num hide-s">${fmt(best(r))}</td><td class="r num hide-s">${r.current ? n : r.n}</td>
      <td class="hide-s"><button class="lnk" style="font-weight:500" data-meet="${esc(last.race)}">${esc(last.meet)}</button><span class="s">${date(last.date)}</span></td></tr>`;
  }).join('');
  el.innerHTML = `<h2>${gn(S.g)} roster</h2>${gchips()}
   <p class="sub">Rating: each runner's expected time today on the Section finals course (Willow Hills, 5K) in mild weather, from all their races, recent ones counting most. Season best: the fastest single race this season converted to that course on that day.</p>
   <div class="bar">${chips([[0, D.meta.season + ' season'], [1, 'All years']], +S.rosterAll, 'data-all')}<input type="search" id="rq" placeholder="Find a runner" value="${esc(S.q)}" aria-label="Find a runner"></div>
   <div class="tw"><table><thead><tr><th class="r">#</th><th>Runner</th><th class="r">Rating</th><th class="r hide-s">Season best</th><th class="r hide-s">Races</th><th class="hide-s">Last race</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="empty">No runners match.</td></tr>'}</tbody></table></div>`;
  el.querySelectorAll('[data-all]').forEach(b => b.onclick = () => { S.rosterAll = b.dataset.all === '1'; roster(); });
  const q = $('#rq'); q.oninput = () => { S.q = q.value; const p = q.selectionStart; roster(); const n = $('#rq'); n.focus(); n.setSelectionRange(p, p); };
}

/* ---------- runner ---------- */
function chart(r) {
  const xs = r.races.filter(x => x.eq_day);
  if (xs.length < 2) return '';
  const W = 720, H = 220, L = 44, Rp = 10, T = 12, B = 26;
  const t = x => new Date(x.date).getTime(), t0 = t(xs[0]), t1 = t(xs[xs.length - 1]) || t0 + 1;
  const v = xs.map(x => x.eq_day), lo = Math.min(...v), hi = Math.max(...v), pad = Math.max(5, (hi - lo) * .08);
  const y0 = lo - pad, y1 = hi + pad;
  const X = x => L + (W - L - Rp) * (t(x) - t0) / Math.max(t1 - t0, 1), Y = s => T + (H - T - B) * (s - y0) / (y1 - y0);
  const ticks = []; const step = (y1 - y0) > 120 ? 30 : (y1 - y0) > 50 ? 15 : 5;
  for (let s = Math.ceil(y0 / step) * step; s <= y1; s += step) ticks.push(s);
  const yrs = []; for (let y = +xs[0].date.slice(0, 4); y <= +xs[xs.length - 1].date.slice(0, 4); y++) yrs.push(y);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Each race as a Willow Hills 5K time on its day; up is faster">
   ${ticks.map(s => `<line x1="${L}" x2="${W - Rp}" y1="${Y(s)}" y2="${Y(s)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(s) + 4}" text-anchor="end">${fmt0(s)}</text>`).join('')}
   ${yrs.map(y => { const d = {date: y + '-09-01'}; const xx = X(d); return xx >= L && xx <= W - Rp ? `<text x="${xx}" y="${H - 6}" text-anchor="middle">${y}</text>` : ''; }).join('')}
   ${xs.map(x => `<circle cx="${X(x)}" cy="${Y(x.eq_day)}" r="4" fill="var(--bar-ours)" fill-opacity=".85"><title>${esc(x.meet)} ${sdate(x.date)}: ${x.time} (${fmt(x.eq_day)} Willow Hills 5K)</title></circle>`).join('')}
   ${r.rating ? `<line x1="${L}" x2="${W - Rp}" y1="${Y(r.rating)}" y2="${Y(r.rating)}" stroke="var(--ink)" stroke-dasharray="4 4"/><text x="${W - Rp}" y="${Y(r.rating) - 5}" text-anchor="end">rating ${fmt(r.rating)}</text>` : ''}
  </svg>`;
}
function runner() {
  const el = $('#t-runner'), r = byId[S.runner] || byId[firstOf(S.g)];
  if (!r) { el.innerHTML = `<h2>Runner</h2>${gchips()}<p class="empty">No runners.</p>`; return; }
  const group = R.filter(x => x.g === r.g);
  const opts = [['Current', group.filter(x => x.current)], ['Earlier years', group.filter(x => !x.current)]].filter(([, xs]) => xs.length).map(([l, xs]) =>
    `<optgroup label="${l}">${xs.map(x => `<option value="${esc(x.id)}" ${x.id === r.id ? 'selected' : ''}>${esc(x.name)}${x.current ? '' : ' (' + clsLabel(x.cls) + ')'}</option>`).join('')}</optgroup>`).join('');
  const champ = c => { const p = r.champs && r.champs[c.key]; return p ? `<div class="card"><div class="k">${esc(c.label)} · ${sdate(c.date)}</div><div class="v num">${fmt(p[0])}</div><div class="s">8 in 10: ${fmt(p[1])} to ${fmt(p[2])}<br>${ord(p[3])} fastest of the ${gn(r.g).toLowerCase()}</div></div>` : ''; };
  const hist = r.races.slice().reverse().map(x => {

     <td><button class="lnk" style="font-weight:500" data-meet="${esc(x.race)}">${esc(x.meet)}</button><span class="s">${esc(x.level)} · ${distLabel(x.dist)}${x.grade ? ' · gr ' + esc(x.grade) : ''}</span></td>
     <td class="r num">${esc(x.time)}<span class="s">${pace(x.sec, x.dist)}</span></td><td class="r num hide-s">${x.place || ''}${x.field ? '<span class="s">of ' + x.field + '</span>' : ''}</td>
     <td class="r num hide-s">${fmt(x.eq_day)}</td><td class="r num">${x.exp ? fmt(x.exp[1]) + '<span class="s">' + fmt0(x.exp[2]) + '–' + fmt0(x.exp[3]) + '</span>' : ''}</td><td>${vsExp(x.sec, x.exp)}</td></tr>`;

  el.innerHTML = `<h2>${esc(r.name)}</h2>${gchips()}
   <p class="sub">${gn(r.g)} · ${r.current ? gradeLabel(r.grade) + ', ' : ''}Class of ${r.cls || '?'} · ${r.n} races since ${date(r.first)}</p>

    <div class="card"><div class="k">Rating today</div><div class="v num">${fmt(r.rating)}</div><div class="s">Willow Hills 5K, mild weather${r.sd ? '<br>typical swing ±' + Math.round(100 * r.sd * 1.28) + '%' : ''}</div></div>
    ${D.meta.champs.map(champ).join('')}
   </div>
   <h3>Every race on one scale</h3>
   <p class="sub">Each race converted to a Willow Hills 5K on its day (course, distance and heat taken out). Up is faster. The dashed line is the rating today.</p>
   ${chart(r)}
   <h3>Race history</h3>
   <p class="sub">Expected: the model's projection the morning of the meet, using only earlier races, adjusted for how the rest of the field ran that day. Range: 8 in 10.</p>
   <div class="tw"><table><thead><tr><th>Date</th><th>Meet</th><th class="r">Time</th><th class="r hide-s">Place</th><th class="r hide-s">5K equiv</th><th class="r">Expected</th><th>Result</th></tr></thead><tbody>${hist}</tbody></table></div>`;

/* ---------- meets ---------- */
const LEVELS = ['Varsity', 'JV', 'Soph', 'Frosh/Soph', 'Frosh', 'Youth'];
function meets() {
  const el = $('#t-meets');
  const seasons = [...new Set(races.map(r => seasonOf(r.date)))].sort((a, b) => b - a);
  if (!seasons.includes(+S.meetSeason)) S.meetSeason = seasons[0];
  const ms = {}; races.filter(r => seasonOf(r.date) === +S.meetSeason).forEach(r => { const k = r.date + '|' + r.meet; (ms[k] = ms[k] || []).push(r); });
  const keys = Object.keys(ms).sort().reverse();
  let cur = S.meet && raceById[S.meet] ? raceById[S.meet] : null;
  let mk = cur ? cur.date + '|' + cur.meet : keys[0];
  if (!ms[mk]) mk = keys[0];
  const all = ms[mk] || [];
  const rs = all.filter(r => r.g === S.g).sort((a, b) => LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level));
  const ours = rs.filter(r => r.rows.some(x => x[6]));
  if (!cur || !rs.includes(cur)) cur = ours[0] || rs[0];
  S.meet = cur ? cur.id : (all[0] && all[0].id);
  const head = `<h2>Meets</h2>${gchips()}
   <div class="bar"><select id="msea" aria-label="Season">${seasons.map(s => `<option ${s === +S.meetSeason ? 'selected' : ''}>${s}</option>`).join('')}</select>
   <select id="mmeet" aria-label="Meet" style="flex:1 1 260px">${keys.map(k => { const [d, m] = k.split('|'); return `<option value="${esc(k)}" ${k === mk ? 'selected' : ''}>${sdate(d)} · ${esc(m)}</option>`; }).join('')}</select></div>`;
  const wire = () => {
    $('#msea').onchange = e => { S.meetSeason = +e.target.value; S.meet = null; meets(); };
    $('#mmeet').onchange = e => { const [d, m] = e.target.value.split('|'); const xs = races.filter(x => x.date === d && x.meet === m);
      const r = xs.find(x => x.g === S.g && x.rows.some(y => y[6])) || xs.find(x => x.g === S.g) || xs[0]; S.meet = r.id; meets(); };
  };
  if (!all.length) { el.innerHTML = head + '<p class="empty">No meets.</p>'; wire(); return; }
  const m0 = all[0];
  const info = `<p class="sub">${date(m0.date)} · ${esc(m0.course)}${m0.temp != null ? ' · about ' + m0.temp + '°F at race time' : ''}</p>`;
  if (!cur) { el.innerHTML = head + info + `<p class="empty">No ${gn(S.g).toLowerCase()} races at this meet.</p>`; wire(); return; }
  const views = chips([['report', 'Report'], ['results', 'Results'], ['teams', 'Team scores']], S.meetView, 'data-view');
  let body = '';
  if (S.meetView === 'report') body = report(ours);
  else {
    body = `<div class="bar">${chips(rs.map(r => [r.id, r.race.replace(/^(Boys|Girls) /, '')]), cur.id, 'data-race')}</div>` +
      `<p class="sub">${esc(cur.race)} · ${esc(cur.level)} · ${distLabel(cur.dist)} · ${cur.n} finishers${cur.day != null ? ' · field ran ' + Math.abs(cur.day).toFixed(1) + '% ' + (cur.day > 0 ? 'faster' : 'slower') + ' than projected' : ''}</p>` +
      (S.meetView === 'results' ? results(cur) : teams(cur));
  }
  el.innerHTML = head + info + `<div class="bar">${views}</div>` + body;
  wire();
  el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.meetView = b.dataset.view; save(); meets(); });
  el.querySelectorAll('[data-race]').forEach(b => b.onclick = () => { S.meet = b.dataset.race; meets(); });
}
function runnerAt(raceId, name) { for (const r of R) for (const x of r.races) if (x.race === raceId && r.name === name) return [r, x]; return [null, null]; }
function report(ours) {
  if (!ours.length) return `<p class="empty">No ${OUR} ${gn(S.g).toLowerCase()} at this meet.</p>`;
  return ours.map(rc => {
    const rows = rc.rows.filter(x => x[6]).map(x => {
      const [r, h] = runnerAt(rc.id, x[1]);
      const prev = r ? r.races.filter(y => y.date < rc.date) : [];
      const pb = r && h && h.eq_day && prev.length && prev.every(y => !y.eq_day || y.eq_day > h.eq_day) ? '<span class="badge pb">Best yet</span>' : '';
      const first = r && !prev.length ? '<span class="badge">First race</span>' : '';
      return `<tr class="ours"><td class="r num">${x[0] ?? ''}</td><td>${r ? nameBtn(r) : esc(x[1])}${pb}${first}<span class="s">${x[2] ? 'gr ' + esc(x[2]) : ''}</span></td>
       <td class="r num">${esc(x[4])}<span class="s">${pace(x[5], rc.dist)}</span></td>
       <td class="r num hide-s">${h && h.exp ? fmt(h.exp[1]) + '<span class="s">' + fmt0(h.exp[2]) + '–' + fmt0(h.exp[3]) + '</span>' : ''}</td><td>${h ? vsExp(x[5], h.exp) : ''}</td></tr>`;
    }).join('');
    const ts = rc.teams.findIndex(t => t.team === OUR);
    const team = ts >= 0 ? `${OUR} ${ord(ts + 1)} of ${rc.teams.length} teams, ${rc.teams[ts].pts} points (unofficial)` : `${OUR} did not score as a team`;
    return `<h3>${esc(rc.race)}</h3><p class="sub">${esc(rc.level)} · ${distLabel(rc.dist)} · ${rc.n} finishers · ${team}${rc.day != null ? ' · field ran ' + Math.abs(rc.day).toFixed(1) + '% ' + (rc.day > 0 ? 'faster' : 'slower') + ' than projected' : ''}</p>
     <div class="tw"><table><thead><tr><th class="r">Pl</th><th>Runner</th><th class="r">Time</th><th class="r hide-s">Expected</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div>`;

/* ---------- model ---------- */

   <div class="tw"><table><thead><tr><th>Group</th><th class="r">Predictions</th><th class="r">Typical miss</th><th class="r hide-s">Lean</th><th class="r">In range</th></tr></thead><tbody>
    ${row('All runners', a.all)}${bg ? row('All ' + G.toLowerCase(), bg.all) + row(OUR + ' ' + G.toLowerCase(), bg.ours) : ''}${row(OUR + ', boys and girls', a.ours)}
    ${(a.by_year || []).filter(x => !x.g || x.g === g).map(x => row(`${OUR} ${G.toLowerCase()} ${x.year}`, x)).join('')}${(a.by_level || []).map(x => row('All runners, ' + x.level, x)).join('')}</tbody></table></div>` : ''}
   <h3>How it works</h3>
   <div class="sub"><p>Every race is put on one scale: the pace a runner would hold for 5K, with the distance scaled by a fitted exponent (${riegel} for ${G.toLowerCase()}) so 2-mile, 3-mile and 3200 m races count too.</p>
   <p>Course and race effects are fitted from runners who ran more than one race, with Willow Hills (the Section finals) at zero. Heat is a separate term from the race-time weather.</p>
   <p>Each runner's rating weights recent races most and lets a single bad day count less. In-season improvement is fitted by school grade${gr ? `: for ${G.toLowerCase()}, about ${gr.map(x => Math.round(100 * x) + '%').join(', ')} a year for grades 9 to 12` : ''}.</p>
   <p>Boys and girls are fitted separately. With one shared model, girls' projections ran about 5% too fast.</p>
   <p>Ranges are 8 in 10: about one race in five should land outside, half of those on each side.</p>
   <p>Real race results are never edited or left out. Only source errors are fixed, such as a finisher posted twice.</p></div>`;
}

$('#foot').innerHTML = `Data through ${date(D.meta.as_of)} · ${D.meta.n_meets} meets, ${D.meta.n_races} races with ${OUR} runners, ${D.meta.n_runners} ${OUR} athletes since 2021. Results from athletic.net and meet timers. Team scores are unofficial.`;
go(S.tab, false);
})();
</script>
